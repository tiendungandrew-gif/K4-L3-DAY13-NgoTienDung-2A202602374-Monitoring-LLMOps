alerts:
  - name: HighLatencyP95Breach
    severity: warning
    condition: latency_p95 > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack-llmops-alerts
    owner: ngotiendung
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: error_rate_pct > 2.0%
    duration: 3m
    type: symptom-based
    channel: slack-llmops-alerts
    owner: ngotiendung
    runbook: docs/alerts.md#alert-2
  - name: RetrievalSuccessRateDrop
    severity: warning
    condition: retrieval_success_rate_pct < 90.0%
    duration: 5m
    type: symptom-based
    channel: slack-llmops-alerts
    owner: ngotiendung
    runbook: docs/alerts.md#alert-3
